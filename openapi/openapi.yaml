components:
  schemas:
    Client:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          description: Contact email, if known
          format: email
          type:
            - string
            - "null"
        id:
          description: Client ID
          format: uuid
          type: string
        name:
          description: Display name
          type: string
        notes:
          description: Free-form notes
          type: string
        tax_id:
          description: Tax identification number, unique among the user's clients
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - email
        - tax_id
        - notes
        - created_at
        - updated_at
      type: object
    ClientFields:
      additionalProperties: false
      properties:
        email:
          description: Contact email
          format: email
          maxLength: 320
          type: string
        name:
          description: Display name
          maxLength: 200
          minLength: 1
          type: string
        notes:
          description: Free-form notes
          maxLength: 5000
          type: string
        tax_id:
          description: Tax identification number
          maxLength: 50
          minLength: 1
          type: string
      required:
        - name
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ListClientsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Client"
          type: array
        next_cursor:
          description: Pass as cursor to get the next page; null on the last page
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    MeOutputBody:
      additionalProperties: false
      properties:
        email:
          description: Email address of the signed-in user
          format: email
          type: string
        id:
          description: User ID
          examples:
            - Yw2hX9sK1bQ
          type: string
        name:
          description: Display name of the signed-in user
          type: string
      required:
        - id
        - email
        - name
      type: object
  securitySchemes:
    bearer:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: Fullstack Starter API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/clients:
    get:
      description: Newest first. Follow next_cursor until it is null.
      operationId: list-clients
      parameters:
        - description: Page size
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Page size
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Value of next_cursor from the previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: Value of next_cursor from the previous page
            type: string
        - description: Filter by a fragment of the name
          explode: false
          in: query
          name: q
          schema:
            description: Filter by a fragment of the name
            maxLength: 200
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListClientsOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearer: []
      summary: List the signed-in user's clients
      tags:
        - Clients
    post:
      operationId: create-client
      parameters:
        - description: Optional. A unique value per logical request, such as a UUID. Retrying with the same key returns the client created the first time instead of creating another. Keys are remembered for 24 hours.
          in: header
          name: Idempotency-Key
          schema:
            description: Optional. A unique value per logical request, such as a UUID. Retrying with the same key returns the client created the first time instead of creating another. Keys are remembered for 24 hours.
            maxLength: 255
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientFields"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
          description: Created
          headers:
            Idempotent-Replayed:
              schema:
                description: "\"true\" when this is the stored response of an earlier request with the same Idempotency-Key"
                type: string
            Location:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearer: []
      summary: Create a client
      tags:
        - Clients
  /api/v1/clients/{id}:
    delete:
      description: "Soft delete: the row is kept for traceability and stops appearing in the API."
      operationId: delete-client
      parameters:
        - description: Client ID
          in: path
          name: id
          required: true
          schema:
            description: Client ID
            format: uuid
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearer: []
      summary: Delete a client
      tags:
        - Clients
    get:
      operationId: get-client
      parameters:
        - description: Client ID
          in: path
          name: id
          required: true
          schema:
            description: Client ID
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearer: []
      summary: Get a client
      tags:
        - Clients
    put:
      operationId: update-client
      parameters:
        - description: Client ID
          in: path
          name: id
          required: true
          schema:
            description: Client ID
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientFields"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearer: []
      summary: Replace a client's fields
      tags:
        - Clients
  /api/v1/me:
    get:
      operationId: get-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearer: []
      summary: Get the signed-in user
      tags:
        - Users
