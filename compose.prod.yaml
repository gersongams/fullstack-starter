# Production-like stack: builds both Dockerfiles and runs them against the
# compose Postgres, so the images are exercised before a release.
#
#   export BETTER_AUTH_SECRET="$(openssl rand -base64 32)"
#   docker compose -f compose.yaml -f compose.prod.yaml up --build
#
# This is an overlay, not a profile inside compose.yaml: compose interpolates
# every service even when its profile is inactive, so the required
# BETTER_AUTH_SECRET below would break plain `docker compose up` (make db-up).
#
# Stop `make dev` first: the stack uses the same host ports (3100 and 8787).

x-api-env: &api-env
  APP_ENV: production
  LOG_LEVEL: info
  PORT: "8787"
  DATABASE_URL: postgres://starter:starter@postgres:5432/starter?sslmode=disable
  # The issuer is compared as a string with the token's `iss` claim, so it is
  # the web app's public origin. The JWKS URL only has to be reachable from the
  # API container, so it uses the compose service name.
  AUTH_ISSUER: ${BETTER_AUTH_URL:-http://localhost:3100}
  AUTH_JWKS_URL: http://web:3100/api/auth/jwks
  AUTH_AUDIENCE: starter-api
  # No TRUSTED_PROXIES: nothing in this stack sits in front of the web app, and
  # Next.js forwards the browser's own X-Forwarded-For unchanged, so believing
  # it would let any client pick its rate-limit bucket. Set it in a deployment
  # where a load balancer appends the real client address.

x-web-env: &web-env
  DATABASE_URL: postgres://starter:starter@postgres:5432/starter
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET, for example with `openssl rand -base64 32`}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3100}
  API_JWT_AUDIENCE: starter-api
  # Locally the mail goes to the Mailpit from compose.yaml (http://localhost:18025).
  # A real deployment points SMTP_URL at its provider.
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  MAIL_FROM: ${MAIL_FROM:-Fullstack Starter <no-reply@localhost>}
  AUTH_REQUIRE_EMAIL_VERIFICATION: "true"

x-web-build: &web-build
  context: .
  dockerfile: apps/web/Dockerfile
  args:
    # Baked into the image: Next.js evaluates the /api/v1 rewrite at build time.
    API_INTERNAL_URL: http://api:8787

services:
  # Release step 1: the API's goose migrations. Also creates the `auth` schema.
  migrate:
    build:
      context: apps/api
    image: starter-api
    command: ["migrate"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Release step 2: Better Auth's tables. The runtime web image is a Next.js
  # standalone bundle without the Better Auth CLI or src/lib/auth.ts, so this
  # runs from the Dockerfile's `build` stage, which has the sources and the
  # devDependencies.
  auth-migrate:
    build:
      <<: *web-build
      target: build
    image: starter-web-build
    working_dir: /repo
    command: ["pnpm", "--filter", "web", "db:migrate"]
    environment: *web-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: apps/api
    image: starter-api
    environment: *api-env
    # Loopback only: the browser reaches the API through the web app's rewrite.
    # The port is published just so /healthz and /readyz can be checked by hand.
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: *web-build
    image: starter-web
    environment: *web-env
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/sign-in').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
